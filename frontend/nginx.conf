limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# 1) Domen orqali kelgan HTTP so'rovlar HTTPS'ga yo'naltiriladi.
server {
    listen 80;
    server_name atd.uzbeksteel.uz uzbeksteel.uz;

    return 301 https://$host$request_uri;
}

# 2) IP orqali (172.16.22.107) ichki tarmoqdan kirish HTTP'da qoladi.
#    Sertifikat IP manzilni qamramaydi, shuning uchun bu yerda redirect yo'q.
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/app_common.conf;
}

# 3) Asosiy HTTPS server.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Sertifikatlar git'da EMAS — serverda ./certs papkasidan volume orqali ulanadi.
    # fullchain.crt = sizning sertifikatingiz + Sectigo oraliq sertifikatlari.
    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/privkey.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — brauzer shu domenga faqat HTTPS orqali kirishini majbur qiladi.
    # Hozir 1 kun. Hammasi barqaror ishlagach 31536000 (1 yil) ga oshirish mumkin.
    # Diqqat: uzun muddat qo'yilsa va sertifikat muddati o'tib ketsa,
    # foydalanuvchilar saytga umuman kira olmaydi.
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/app_common.conf;
}
