# Ilovaning asosiy yo'llari. HTTP va HTTPS server bloklarining ikkalasiga
# ham shu fayl include qilinadi — sozlama bir joyda turadi.
#
# Diqqat: location ichida `add_header` yozilsa, server darajasidagi barcha
# add_header'lar (HSTS ham) o'sha location uchun bekor bo'ladi. Shuning uchun
# keshlash `expires` bilan beriladi — u header merosini buzmaydi.

root /usr/share/nginx/html;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /api/auth/login {
    limit_req zone=login burst=20 nodelay;
    error_page 429 = @too_many_logins;

    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @too_many_logins {
    default_type application/json;
    return 429 "{\"error\":\"Juda ko'p urinish. Bir daqiqadan keyin qayta urinib ko'ring\"}";
}

location /api/ {
    limit_req zone=api burst=60 nodelay;

    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50M;
    # Katta hisobot (PDF/Word) shakllanishiga vaqt
    proxy_read_timeout 120s;
}

# Vite fayl nomlariga hash qo'shadi — ularni uzoq keshlash xavfsiz
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# index.html keshlanmaydi: deploy'dan keyin brauzer eski index.html bilan
# o'chirilgan JS fayllarni so'rab oq ekran ko'rsatmasin
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
