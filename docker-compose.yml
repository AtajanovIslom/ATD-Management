# Backend va Telegram poller uchun umumiy sozlamalar
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1111}@db:5432/${POSTGRES_DB:-hisobot}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
  # Firebase (mobil bildirishnomalar). Fayl volume orqali ulanadi —
  # image ichiga yozilmaydi. Kalit bo'lmasa push jim o'chadi.
  FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
  PUSH_ENABLED: ${PUSH_ENABLED:-1}
  FCM_ANDROID_CHANNEL_ID: ${FCM_ANDROID_CHANNEL_ID:-atd_high_importance}
  # ISUP (kadrlar tizimi) — qiymatlar faqat serverdagi .env'da
  ISUP_USER: ${ISUP_USER:-}
  ISUP_PASSWORD: ${ISUP_PASSWORD:-}
  # Telegram bot — token BotFather'dan, faqat serverdagi .env'da
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://atd.uzbeksteel.uz}
  TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
  # Korporativ pochta (IMAP) — yangi xatlar botga. Parollar shifrlanadi.
  MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-mail.uzbeksteel.uz}
  MAIL_CHECK_INTERVAL: ${MAIL_CHECK_INTERVAL:-60}
  MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-}

# Pochta serveri ichki manzili. Tashqi DNS mail.uzbeksteel.uz ni 45.150.25.50
# ga yo'naltiradi — server tarmog'idan u yopiq, ichki 172.16.1.5 esa ochiq.
# Nom o'zgarmagani uchun TLS sertifikati (*.uzbeksteel.uz) to'g'ri tekshiriladi.
x-backend-hosts: &backend-hosts
  - "mail.uzbeksteel.uz:${MAIL_IMAP_IP:-172.16.1.5}"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hisobot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1111}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    environment: *backend-env
    extra_hosts: *backend-hosts
    volumes:
      - uploads:/app/uploads
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  # Telegram bot — xabarlarni getUpdates bilan qabul qiladi (polling).
  # Backend bilan bir xil image; YAGONA nusxada ishlashi shart, aks holda
  # bitta xabar ikki marta qayta ishlanadi. Token bo'lmasa jim kutadi.
  telegram:
    build: ./backend
    restart: always
    command: ["python", "-m", "app.telegram_poller"]
    environment: *backend-env
    extra_hosts: *backend-hosts
    volumes:
      - uploads:/app/uploads
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # TLS sertifikatlar. Git'da kuzatilmaydi — serverda qo'lda joylashtiriladi:
      #   certs/fullchain.crt  (sertifikat + Sectigo oraliq zanjiri)
      #   certs/privkey.key    (maxfiy kalit, chmod 600)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
