services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hisobot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1111}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1111}@db:5432/${POSTGRES_DB:-hisobot}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-prod}
      # Firebase (mobil bildirishnomalar). Fayl volume orqali ulanadi —
      # image ichiga yozilmaydi. Kalit bo'lmasa push jim o'chadi.
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
      PUSH_ENABLED: ${PUSH_ENABLED:-1}
      FCM_ANDROID_CHANNEL_ID: ${FCM_ANDROID_CHANNEL_ID:-atd_high_importance}
    volumes:
      - uploads:/app/uploads
      - ./backend/secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # TLS sertifikatlar. Git'da kuzatilmaydi — serverda qo'lda joylashtiriladi:
      #   certs/fullchain.crt  (sertifikat + Sectigo oraliq zanjiri)
      #   certs/privkey.key    (maxfiy kalit, chmod 600)
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
